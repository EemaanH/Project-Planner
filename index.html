<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title> Project Planner</title>

  <link rel="stylesheet" href="style.css">
</head>

  <body>
    <h1> Project Display Planner</h1>

    <div class="controls">

    <label>
    Display Width:
    <input type="number" id="displayWidth" value="24">
      inches
    </label>
    <label>
      Display Height:
      <input type="number" id="displayHeight" value="18">
      inches
    </label>
      <button id="addObject">+ Add Object</button>
    </div>
    
      <div id="objectPanel">
        <h2>Add Object</h2>

        <label>
          Object Name:
          <input type="text" id="objectName">
        </label>

          <label>
            Width (inches):
            <input type="number" id="objectWidth">
          </label>

          <label>
            Height (inches):
            <input type="number" id="objectHeight">
          </label>

        <button id="createObject">Create Object</button>
        <button id="editObject">Edit Selected Object</button>
        <button id="updateObject"> Update Object</button>
    </div>
    <div id="display">
    </div>

    <script src="script.js"></script>
  </body>
</html>
